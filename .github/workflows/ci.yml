name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Python 3.12 on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras --dev

      # The floor is the measured coverage, 95 percent, rounded down and reduced
      # by two, so that a small platform difference in which lines run cannot
      # fail the build while a real drop in coverage still does.
      - name: Run tests with coverage
        run: >
          uv run pytest -q
          --cov=src/arc_benchmark
          --cov-report=term-missing
          --cov-fail-under=93

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy
